<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=contain">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e151d">
  <meta name="apple-mobile-web-app-title" content="배뷰 파트너">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://baeview-partner-pilot-wbznui.flutterflow.app; style-src 'unsafe-inline'; font-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>배뷰 파트너</title>
  <link rel="manifest" href="./partner.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./baeview-partner-transparent-192-20261126.png">
  <link rel="apple-touch-icon" href="./baeview-partner-transparent-192-20261126.png">
  <script src="./install.js?v=mobile-ui-20261126" defer></script>
  <style>
    @font-face { font-family: 'Noto Sans KR'; src: url('../baeview-notosanskr.woff') format('woff'); font-display: swap; }
    html { font-family: 'Noto Sans KR', sans-serif; }
    html, body { margin: 0; background: #0e151d; color: #f2fafb; }
    body {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      height: var(--partner-visible-height, 100dvh);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    iframe { border: 0; display: block; width: 100%; min-height: 0; flex: 1 1 0; }
    .install { display: flex; justify-content: center; background: #142333cc; }
    button, input, select, textarea, dialog { font: inherit; }
    button { color: #b7f5e5; border: 1px solid #497d7c; border-radius: 9px; background: #163642; }
    button:focus-visible { outline: 2px solid #82edd4; outline-offset: 2px; }
    .install button { min-height: 44px; margin: 3px 0; padding: 0 16px; font-size: 13px; }
    dialog { color: #eef9fb; background: #182937; border: 1px solid #497d7c; border-radius: 14px; max-width: min(300px, 75vw); }
    dialog::backdrop { background: #060f18b3; }
    dialog p { margin: 0 0 12px; font-size: 14px; }
    dialog button { min-height: 44px; padding: 0 12px; }
    .back-message {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 77px);
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 24px);
      box-sizing: border-box;
      border-radius: 12px;
      padding: 10px 14px;
      background: #172b39f5;
      color: #edf9fc;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }
    [hidden] { display: none !important; }
    @media (display-mode: standalone) { .install { display: none; } }
  </style>
</head>
<body>
  <div id="install-bar" class="install" hidden><button id="install-button" type="button">홈 화면에 앱 설치</button></div>
  <iframe
    id="partner-frame" title="배뷰 파트너 포털 연결"
    src="https://baeview-partner-pilot-wbznui.flutterflow.app/?release=bp-rider-readout-20261128-0924"
    allow="clipboard-write https://baeview-partner-pilot-wbznui.flutterflow.app"
    referrerpolicy="no-referrer"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
  ></iframe>
  <dialog id="install-help" aria-label="배뷰 파트너 설치">
    <p id="install-message"></p>
    <button id="install-close" type="button">닫기</button>
  </dialog>
  <div id="back-message" class="back-message" role="status" hidden>한 번 더 누르면 앱에서 나가요.</div>
</body>
</html>
